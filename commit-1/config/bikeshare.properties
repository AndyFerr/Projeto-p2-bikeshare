# ---------------------------------------------------------------------------
# Parametros de negocio do BIKESHARE (requisito nao funcional BS04).
# Alterar um valor aqui muda a regra sem recompilar nenhuma classe.
# ---------------------------------------------------------------------------

# Plano atribuido a quem nao escolhe um plano no cadastro
plano.padrao=avulso

# Plano avulso: sem franquia, cobra todos os minutos
plano.avulso.franquiaMinutos=0
plano.avulso.valorMinuto=0.50

# Plano assinante: franquia gratuita por corrida + excedente por minuto
plano.assinante.franquiaMinutos=60
plano.assinante.valorMinutoExcedente=0.30
plano.assinante.mensalidade=30.00

# Bicicleta eletrica
bicicleta.eletrica.adicionalPorMinuto=0.20
bicicleta.eletrica.nivelMinimoBateria=15

# Alugueis
aluguel.carenciaMinutos=2
aluguel.tempoMaximoMinutos=1440

# Penalidade automatica por aluguel expirado
penalidade.atraso.valor=10.00
